[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hr-saas"
version = "0.1.0"
description = "Multi-tenant HR screening service: every company connects its own Telegram bot, builds vacancy questionnaires in a web cabinet, candidates are scored and ranked; plans with limits, webhooks, encrypted bot tokens"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Vladyslav Shokun", email = "sonoyumiii@gmail.com" }]
dependencies = [
    "aiogram>=3.13,<4",
    "aiosqlite>=0.20,<1",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0,<2",
    "openpyxl>=3.1,<4",
    "cryptography>=42",
    "anthropic>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27,<1",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/sonoyumi/hr-saas"

[project.scripts]
hr-saas = "hr_saas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hr_saas = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC"]
