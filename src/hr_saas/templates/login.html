{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block main_class %}center{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login">
  <h1>🧑‍💼 {{ platform }}</h1>
  <p class="muted">Кабинет компании: вакансии, анкеты, кандидаты</p>
  {% if err %}<p class="alert">{{ err }}</p>{% endif %}
  <label>E-mail<input name="email" type="email" autocomplete="username" required autofocus></label>
  <label>Пароль<input name="password" type="password" autocomplete="current-password" required></label>
  <input type="hidden" name="next" value="{{ next }}">
  <button class="primary">Войти</button>
  <p class="muted">Нет кабинета? <a href="/signup">Зарегистрировать компанию</a></p>
</form>
{% endblock %}
